name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestao-de-tablets-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to distribution repo
        env:
          PUSH_TOKEN: ${{ secrets.APK_REPO_PUSH_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          git clone "https://${PUSH_TOKEN}@github.com/LUIZBAKER77/Gestao-de-Tablets-APK.git" apk-repo
          rm -f apk-repo/Gestao-de-Tablets-debug.apk
          cp "$APK_FILE" apk-repo/Gestao-de-Tablets-release.apk
          cd apk-repo
          git config user.email "dev@gestaodetablets.local"
          git config user.name "Gestao de Tablets Bot"
          git add -A
          git commit -m "Publica APK de release assinado (build automatica via GitHub Actions)" || echo "Nada para commitar"
          git push origin main
