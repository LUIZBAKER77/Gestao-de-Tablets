name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Permissão de execução do gradlew
        run: chmod +x gradlew

      - name: Decodificar keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Compilar APK assinado
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remover keystore
        if: always()
        run: rm -f release.keystore

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/*.apk GestaoDeTablets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: GestaoDeTablets.apk

  configurador:
    name: Configurador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar executável
        working-directory: GestorEscolarTool
        run: |
          pip install customtkinter pyinstaller
          python -m PyInstaller --onefile --windowed --noconfirm --name GestorEscolar_Configurador gestor_escolar_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: configurador
          path: GestorEscolarTool/dist/GestorEscolar_Configurador.exe

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, configurador]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Criar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
